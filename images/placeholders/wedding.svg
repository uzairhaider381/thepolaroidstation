<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-wedding.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EB" />
      <stop offset="100%" stop-color="#F5E3D0" />
    </linearGradient>
    <pattern id="grain-wedding.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#1b1b1b" opacity="0.04"/>
      <circle cx="30" cy="20" r="0.8" fill="#1b1b1b" opacity="0.03"/>
      <circle cx="20" cy="35" r="1.2" fill="#1b1b1b" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#grad-wedding.svg)" />
  <rect width="600" height="600" fill="url(#grain-wedding.svg)" />
  
  <!-- Subtle decorative frame -->
  <rect x="24" y="24" width="552" height="552" rx="12" fill="none" stroke="#D9B26F" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.45"/>
  
  <!-- Center content -->
  <g transform="translate(300, 260)" text-anchor="middle">
    <!-- Icon circle -->
    <circle cx="0" cy="-30" r="54" fill="#FFFDF8" opacity="0.85" />
    <text x="0" y="-12" font-size="44" text-anchor="middle">💍</text>
    
    <text x="0" y="55" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#1B1B1B" letter-spacing="0.5">At Weddings</text>
    <text x="0" y="92" font-family="'DM Sans', 'Poppins', sans-serif" font-size="16" font-weight="500" fill="#5C5751" letter-spacing="0.3">Timeless love captured in 2 minutes</text>
    
    <!-- Polaroid Station stamp badge -->
    <rect x="-100" y="125" width="200" height="28" rx="14" fill="#1B1B1B" opacity="0.08"/>
    <text x="0" y="144" font-family="'Caveat', cursive" font-size="16" font-weight="600" fill="#1B1B1B">✦ the polaroid station ✦</text>
  </g>
</svg>